<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матчи — FootballStats</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo"><i class="fas fa-futbol"></i><span>FootballStats</span></a>
            <ul class="nav-menu">
                <li><a href="/dashboard">Панель</a></li>
                <li><a href="/matches" class="active">Матчи</a></li>
                <li><a href="/predict">Прогнозы</a></li>
                <li><a href="/audit">Аудит</a></li>
            </ul>
            <div class="nav-actions"></div>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-futbol"></i> Матчи</h1>
            <button class="btn btn-primary" id="addBtn" style="display:none" onclick="openModal()">
                <i class="fas fa-plus"></i> Добавить матч
            </button>
        </div>

        <div class="table-card">
            <div id="tableBody"><div class="loader"></div></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Новый матч</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="matchForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label>Домашняя команда</label>
                    <input type="text" id="homeTeam" placeholder="Arsenal" required>
                </div>
                <div class="form-group">
                    <label>Гостевая команда</label>
                    <input type="text" id="awayTeam" placeholder="Chelsea" required>
                </div>
                <div class="form-group">
                    <label>Дата матча</label>
                    <input type="datetime-local" id="matchDate" required>
                </div>
                <div class="form-group">
                    <label>Счёт (дома)</label>
                    <input type="number" id="homeScore" min="0" value="0">
                </div>
                <div class="form-group">
                    <label>Счёт (гости)</label>
                    <input type="number" id="awayScore" min="0" value="0">
                </div>
                <div class="form-group">
                    <label>Статус</label>
                    <select id="matchStatus">
                        <option value="scheduled">Запланирован</option>
                        <option value="finished">Завершён</option>
                    </select>
                </div>
                <input type="hidden" id="editId">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-save"></i> Сохранить
                </button>
            </form>
        </div>
    </div>

    <footer class="footer"><div class="container"><p>&copy; 2026 FootballStats</p></div></footer>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        let matches = [];

        async function loadMatches() {
            const ok = await Auth.requireAuth();
            if (!ok) return;

            // Показать кнопку "Добавить" для admin/operator
            if (Auth.canEdit()) document.getElementById('addBtn').style.display = '';

            try {
                matches = await API.getMatches();
                renderTable();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<div class="no-data"><i class="fas fa-exclamation-triangle"></i><p>${err.message}</p></div>`;
            }
        }

        function renderTable() {
            const can = Auth.canEdit();
            if (!matches || matches.length === 0) {
                document.getElementById('tableBody').innerHTML = '<div class="no-data"><i class="fas fa-futbol"></i><p>Нет матчей. Создайте первый!</p></div>';
                return;
            }
            let html = `<table class="data-table">
                <thead><tr>
                    <th>ID</th><th>Дома</th><th>Счёт</th><th>Гости</th><th>Дата</th><th>Статус</th>
                    ${can ? '<th>Действия</th>' : ''}
                </tr></thead><tbody>`;
            matches.forEach(m => {
                const status = m.status === 'finished'
                    ? '<span class="status-badge finished">Завершён</span>'
                    : '<span class="status-badge scheduled">Запланирован</span>';
                html += `<tr>
                    <td>${m.ID || m.id}</td>
                    <td><strong>${m.home_team}</strong></td>
                    <td><strong>${m.home_score} : ${m.away_score}</strong></td>
                    <td><strong>${m.away_team}</strong></td>
                    <td>${formatDateShort(m.match_date || m.date)}</td>
                    <td>${status}</td>
                    ${can ? `<td class="actions-cell">
                        <button class="btn btn-ghost btn-sm btn-icon" title="Редактировать" onclick='editMatch(${JSON.stringify(m).replace(/'/g,"&#39;")})'>
                            <i class="fas fa-pen"></i>
                        </button>
                        <button class="btn btn-danger btn-sm btn-icon" title="Удалить" onclick="deleteMatch(${m.ID || m.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>` : ''}
                </tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('tableBody').innerHTML = html;
        }

        function openModal(title = 'Новый матч') {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('matchForm').reset();
            document.getElementById('editId').value = '';
        }

        function editMatch(m) {
            document.getElementById('homeTeam').value = m.home_team;
            document.getElementById('awayTeam').value = m.away_team;
            document.getElementById('homeScore').value = m.home_score;
            document.getElementById('awayScore').value = m.away_score;
            document.getElementById('matchStatus').value = m.status || 'scheduled';
            document.getElementById('editId').value = m.ID || m.id;
            if (m.match_date || m.date) {
                const d = new Date(m.match_date || m.date);
                document.getElementById('matchDate').value = d.toISOString().slice(0, 16);
            }
            openModal('Редактировать матч');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const data = {
                home_team: document.getElementById('homeTeam').value,
                away_team: document.getElementById('awayTeam').value,
                home_score: parseInt(document.getElementById('homeScore').value) || 0,
                away_score: parseInt(document.getElementById('awayScore').value) || 0,
                match_date: new Date(document.getElementById('matchDate').value).toISOString(),
                status: document.getElementById('matchStatus').value
            };

            const editId = document.getElementById('editId').value;
            try {
                if (editId) {
                    await API.updateMatch(editId, data);
                    showToast('Матч обновлён', 'success');
                } else {
                    await API.createMatch(data);
                    showToast('Матч создан', 'success');
                }
                closeModal();
                loadMatches();
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
        }

        async function deleteMatch(id) {
            if (!confirm('Удалить матч #' + id + '?')) return;
            try {
                await API.deleteMatch(id);
                showToast('Матч удалён', 'success');
                loadMatches();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        loadMatches();
    </script>
</body>
</html>
