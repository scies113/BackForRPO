<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Details</title>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <!-- code here -->
        <div class="match">
            <div class="match-header">
                <div class="match-tournament">
                    <img src="https://assets.codepen.io/285131/pl-logo.svg" alt="PL Logo" />
                    English Premier League
                </div>
            </div>
            <div class="match-content">
                <div class="column">
                    <div class="team team--home">
                        <div class="team-logo">
                            <img src="https://assets.codepen.io/285131/whufc.svg" alt="West Ham" />
                        </div>
                        <h2 class="team-name">West Ham</h2>
                    </div>
                </div>
                <div class="column">
                    <div class="match-details">
                        <button class="match-bet-place">Получить прогноз</button>
                    </div>
                </div>
                <div class="column">
                    <div class="team team--away">
                        <div class="team-logo">
                            <img src="https://assets.codepen.io/285131/chelsea.svg" alt="Chelsea" />
                        </div>
                        <h2 class="team-name">Chelsea</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
