services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: football-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234567890}
      POSTGRES_DB: ${DB_NAME:-football_stats}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ML-модель (Python FastAPI + XGBoost)
  ml:
    build:
      context: ./ml_model
      dockerfile: Dockerfile
    container_name: football-ml
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Go-бэкенд
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: football-app
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234567890}
      DB_NAME: ${DB_NAME:-football_stats}
      DB_SSLMODE: disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ML_PREDICT_URL: http://ml:8000/predict
    depends_on:
      db:
        condition: service_started
      ml:
        condition: service_healthy

volumes:
  postgres_data: